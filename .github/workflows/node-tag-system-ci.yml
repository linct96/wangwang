name: Node Tag System CI

on:
  push:
    branches:
      - feat/node-tag-system

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate migration metadata
        run: |
          pnpm exec drizzle-kit generate --name normalize_tags
          git add drizzle
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: generate tag migration metadata"
            git push
          fi
      - run: pnpm db:migrate:local
      - run: pnpm format
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
