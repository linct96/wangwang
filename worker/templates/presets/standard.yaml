---
name: 标准规则模板
description: 国内直连 / AI 与流媒体
order: 3
---
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true

# 并发尝试解析得到的多个 IP，采用先成功的连接
tcp-concurrent: true

# 持久化选中节点和 Fake-IP 映射
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  # 极速模式：DNS 查询不强制遵循分流规则
  respect-rules: false

  fake-ip-filter:
    - +.lan
    - +.local
    - +.localdomain
    - localhost
    - localhost.ptlogin2.qq.com
    - localhost.sec.qq.com
    - localhost.weixin.qq.com
    - localhost.*.weixin.qq.com
    - +.ntp.org
    - +.stun.*.*
    - +.stun.*.*.*
    - +.stun.*.*.*.*
    - +.stun.*.*.*.*.*
    - +.n.n.srv.nintendo.net
    - +.stun.playstation.net
    - +.xboxlive.com

  # DNS 引导服务器
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 使用本地 UDP DNS，减少加密 DNS 连接开销
  nameserver:
    - 1.1.1.1
    - 8.8.8.8

  # 代理节点域名使用本地 DNS
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 直连出口使用本地 DNS
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  direct-nameserver-follow-policy: true

  nameserver-policy:
    'geosite:private':
      - system
    'geosite:cn':
      - 223.5.5.5
      - 119.29.29.29

proxy-groups:
  - name: 🚀 节点选择
    type: select
    include-all-proxies: true
    include-all-providers: true
    proxies:
      - ⚡ 自动选择
      - ♻️ 故障转移
      - DIRECT
  - name: ⚡ 自动选择
    type: url-test
    include-all-proxies: true
    include-all-providers: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: ♻️ 故障转移
    type: fallback
    include-all-proxies: true
    include-all-providers: true
    url: https://www.gstatic.com/generate_204
    interval: 300
  - name: 🤖 AI 服务
    type: select
    include-all-proxies: true
    include-all-providers: true
    proxies:
      - 🚀 节点选择
      - ⚡ 自动选择
      - ♻️ 故障转移
      - DIRECT
  - name: 🎬 流媒体
    type: select
    include-all-proxies: true
    include-all-providers: true
    proxies:
      - 🚀 节点选择
      - ⚡ 自动选择
      - ♻️ 故障转移
      - DIRECT
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - ⚡ 自动选择
      - ♻️ 故障转移
      - DIRECT
  - name: 🛑 广告拦截
    type: select
    default-selected: REJECT
    proxies:
      - REJECT
      - DIRECT
rule-providers:
  private-domain:
    type: http
    behavior: domain
    format: mrs
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs'
    path: ./ruleset/private-domain.mrs
    interval: 86400
  private-ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs'
    path: ./ruleset/private-ip.mrs
    interval: 86400
  category-ads-all-domain:
    type: http
    behavior: domain
    format: mrs
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs'
    path: ./ruleset/category-ads-all-domain.mrs
    interval: 86400
  category-ai-!cn-domain:
    type: http
    behavior: domain
    format: mrs
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.mrs'
    path: ./ruleset/category-ai-!cn-domain.mrs
    interval: 86400
  youtube-domain:
    type: http
    behavior: domain
    format: mrs
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.mrs'
    path: ./ruleset/youtube-domain.mrs
    interval: 86400
  netflix-domain:
    type: http
    behavior: domain
    format: mrs
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/netflix.mrs'
    path: ./ruleset/netflix-domain.mrs
    interval: 86400
  spotify-domain:
    type: http
    behavior: domain
    format: mrs
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/spotify.mrs'
    path: ./ruleset/spotify-domain.mrs
    interval: 86400
  tiktok-domain:
    type: http
    behavior: domain
    format: mrs
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/tiktok.mrs'
    path: ./ruleset/tiktok-domain.mrs
    interval: 86400
  cn-domain:
    type: http
    behavior: domain
    format: mrs
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs'
    path: ./ruleset/cn-domain.mrs
    interval: 86400
  cn-ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs'
    path: ./ruleset/cn-ip.mrs
    interval: 86400
rules:
  - DOMAIN,services.googleapis.cn,🚀 节点选择
  - RULE-SET,private-domain,DIRECT
  - RULE-SET,private-ip,DIRECT,no-resolve
  - RULE-SET,category-ads-all-domain,🛑 广告拦截
  - RULE-SET,category-ai-!cn-domain,🤖 AI 服务
  - RULE-SET,youtube-domain,🎬 流媒体
  - RULE-SET,netflix-domain,🎬 流媒体
  - RULE-SET,spotify-domain,🎬 流媒体
  - RULE-SET,tiktok-domain,🎬 流媒体
  - RULE-SET,cn-domain,DIRECT
  - RULE-SET,cn-ip,DIRECT,no-resolve
  - MATCH,🐟 漏网之鱼

geox-url:
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  mmdb: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb
  asn: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb
